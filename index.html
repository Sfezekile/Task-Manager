<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum – Task Dashboard</title>
  <!-- Split by layer: base tokens/layout first, then components, then views -->
  <link rel="stylesheet" href="css/base/tokens.css" />
  <link rel="stylesheet" href="css/base/layout.css" />
  <link rel="stylesheet" href="css/base/states.css" />
  <link rel="stylesheet" href="css/base/responsive.css" />
  <link rel="stylesheet" href="css/components/sidebar.css" />
  <link rel="stylesheet" href="css/components/alerts.css" />
  <link rel="stylesheet" href="css/components/legend.css" />
  <link rel="stylesheet" href="css/components/form.css" />
  <link rel="stylesheet" href="css/components/modal.css" />
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="css/views/dashboard-shell.css" />
  <link rel="stylesheet" href="css/views/board.css" />
  <link rel="stylesheet" href="css/views/calendar.css" />
  <link rel="stylesheet" href="css/views/gantt.css" />
  <link rel="stylesheet" href="css/views/tasklist.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>

  <!-- Always-reachable nav toggle for small screens, so a collapsed sidebar can never trap the user -->
  <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Open navigation">
    <i class="ri-menu-line"></i>
  </button>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="app-body">

    <!-- LEFT NAVIGATION (now includes topbar) -->
    <aside class="side-nav" id="sideNav">
      <!-- Topbar content moved here -->
      <div class="side-topbar">
        <div class="side-topbar-header">
          <div class="logo">
            <span class="logo-mark">Momentum</span>
          </div>
          <button class="side-nav-toggle" id="sideNavToggle" title="Expand/collapse navigation">
            <i class="ri-menu-line"></i>
          </button>
        </div>

        <!-- Date navigation -->
        <div class="side-date-nav">
          <button class="nav-btn" id="prevBtn" title="Previous mode"><i class="ri-arrow-left-s-line"></i></button>
          <span class="date-label" id="currentDateLabel">Loading…</span>
          <button class="nav-btn" id="nextBtn" title="Next mode"><i class="ri-arrow-right-s-line"></i></button>
        </div>

        <!-- Status filter tabs (board / task list views) -->
        <div class="side-filter-wrap" id="topbarFilterWrap">
          <nav class="view-tabs" id="statusTabs">
            <button class="tab-btn active" data-status="all">All</button>
            <button class="tab-btn" data-status="todo">To Do</button>
            <button class="tab-btn" data-status="inprogress">In Progress</button>
            <button class="tab-btn" data-status="blocked">Blocked</button>
            <button class="tab-btn" data-status="done">Done</button>
          </nav>
        </div>

        <!-- Action buttons -->
        <div class="side-actions">
          <button class="btn-icon" id="alertToggleBtn" title="Alerts">
            <i class="ri-notification-3-line"></i>
            <span class="alert-badge" id="alertBadge">0</span>
          </button>
          <button class="btn-icon" id="backupBtn" title="Backup Data">
            <i class="ri-download-2-line"></i>
          </button>
          <button class="btn-icon" id="restoreBtn" title="Restore Data">
            <i class="ri-upload-2-line"></i>
          </button>
          <button class="btn-today" id="todayBtn" title="Show tasks due today">Due Today</button>
          <button class="fab" id="fabBtn" title="Add Task">
            <i class="ri-add-line"></i> <span class="fab-label">Add Task</span>
          </button>
        </div>
      </div>

      <!-- QUICK ACTION BLOCK - New! -->
      <div class="quick-add-block">
        <div class="quick-add-header">
          <span class="quick-add-label">Quick Action</span>
        </div>
        <div class="quick-add-grid">
          <button class="quick-add-btn" data-type="task" title="Quick Add Task">
            <i class="ri-checkbox-circle-line"></i>
            <span>Task</span>
          </button>
          <button class="quick-add-btn" data-type="project" title="Quick Add Project">
            <i class="ri-folder-4-line"></i>
            <span>Project</span>
          </button>
          <button class="quick-add-btn" data-type="bug" title="Quick Add Bug">
            <i class="ri-bug-2-line"></i>
            <span>Bug</span>
          </button>
        </div>
      </div>

      <!-- Navigation items -->
      <nav class="side-nav-list">
        <button class="side-nav-item active" data-view="board" title="Dashboard">
          <i class="ri-layout-grid-line"></i>
          <span class="side-nav-label">Dashboard</span>
        </button>
        <button class="side-nav-item" data-view="calendar" title="Calendar">
          <i class="ri-calendar-2-line"></i>
          <span class="side-nav-label">Calendar</span>
        </button>
        <button class="side-nav-item" data-view="gantt" title="Gantt">
          <i class="ri-bar-chart-horizontal-line"></i>
          <span class="side-nav-label">Gantt</span>
        </button>
        <button class="side-nav-item" data-view="list" title="Task List">
          <i class="ri-list-check-2"></i>
          <span class="side-nav-label">Task List</span>
        </button>
      </nav>
    </aside>

    <!-- DASHBOARD AREA -->
    <main class="calendar-area" id="dashboardArea">

      <!-- MODE SWITCHER -->
      <div class="mode-switcher" id="modeSwitcher">
        <button class="mode-btn" data-mode="student">
          <i class="ri-graduation-cap-line"></i>
          <span>Student</span>
        </button>
        <button class="mode-btn" data-mode="personal">
          <i class="ri-flask-line"></i>
          <span>Personal</span>
        </button>
        <button class="mode-btn" data-mode="work">
          <i class="ri-briefcase-line"></i>
          <span>Work</span>
        </button>
      </div>

      <!-- STATS -->
      <div class="stats-row" id="statsRow"></div>

      <!-- MAIN VIEW -->
      <div id="mainViewWrap"></div>

    </main>

    <!-- ALERT DRAWER -->
    <div class="alert-drawer-overlay" id="alertDrawerOverlay"></div>
    <aside class="alert-drawer" id="alertDrawer">
      <div class="drawer-header">
        <h2>⚠️ Alerts</h2>
        <button class="close-btn" id="closeAlertBtn" aria-label="Close alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="alert-drawer-content" id="alertDrawerContent"></div>
    </aside>

    <!-- UPCOMING PANEL -->
    <aside class="legend-panel" id="legendPanel">
      <div class="legend-header">
        <h3>Upcoming</h3>
        <span class="legend-count" id="legendCount">0 tasks</span>
      </div>
      <div class="legend-list" id="legendList">
        <p class="empty-legend">No tasks yet.</p>
      </div>
    </aside>

  </div>

  <!-- ===== TASK FORM DRAWER ===== -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="form-drawer" id="formDrawer">
    <div class="drawer-header">
      <h2 id="drawerTitle">Add Task</h2>
      <button class="close-btn" id="closeDrawerBtn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form class="leave-form" id="taskForm" novalidate>
      <input type="hidden" id="editId" />

      <div class="field-group">
        <label for="title">Title <span class="required">*</span></label>
        <input type="text" id="title" placeholder="e.g. Submit Chapter 4 essay" autocomplete="off" />
        <span class="field-error" id="titleError"></span>
      </div>

      <div class="field-group">
        <label for="category">Category <span class="required">*</span></label>
        <select id="category">
          <option value="">Select category…</option>
        </select>
        <span class="field-error" id="categoryError"></span>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="field-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="todo" selected>To Do</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" />
          <span class="field-error" id="startDateError"></span>
        </div>
        <div class="field-group">
          <label for="dueDate">Due Date <span class="required">*</span></label>
          <input type="date" id="dueDate" />
          <span class="field-error" id="dueDateError"></span>
        </div>
      </div>

      <div class="field-group">
        <label for="dependsOn">Depends On</label>
        <select id="dependsOn">
          <option value="">None</option>
        </select>
        <span class="field-error" id="dependsOnError"></span>
      </div>

      <div class="field-group">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="3" placeholder="Details, links, context (optional)"></textarea>
      </div>

      <div class="dependency-display" id="dependencyDisplay"></div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" id="cancelFormBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="submitBtn">Save Task</button>
      </div>
    </form>
  </aside>

  <!-- ===== TASK DETAIL MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="taskModal">
      <div class="modal-header" id="modalHeader">
        <div class="modal-name" id="modalName"></div>
        <div class="modal-type-badge" id="modalTypeBadge"></div>
        <button class="close-btn modal-close" id="modalCloseBtn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-grid" id="modalGrid"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary btn-sm" id="modalEditBtn">Edit</button>
        <button class="btn-danger btn-sm" id="modalDeleteBtn">Delete Task</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Split by layer. Order matters: these are plain scripts sharing one
       global scope (no bundler/modules), so data → helpers → ui → views → main. -->
  <script src="js/data/constants.js"></script>
  <script src="js/data/date-utils.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/data/backup.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/alerts.js"></script>
  <script src="js/views/dashboard-core.js"></script>
  <script src="js/views/view-board.js"></script>
  <script src="js/views/view-calendar.js"></script>
  <script src="js/views/view-gantt.js"></script>
  <script src="js/views/view-tasklist.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
